<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Commandes T-shirts & Sweats — Établissement</title>
  <!-- SDK Firebase (Compat pour fichier HTML autonome sans bundler) -->

  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --border: #d0d7de;
      --border-light: #e5e9f0;
      --text: #1f2328;
      --muted: #57606a;
      --primary: #0969da;
      --primary-hover: #0550ae;
      --green-bg: #dafbe1;
      --green-text: #1a7f37;
      --orange-bg: #fff8c5;
      --orange-text: #9a6700;
      --blue-bg: #ddf4ff;
      --blue-text: #0969da;
      --purple-bg: #fbefff;
      --purple-text: #8250df;
      --danger: #cf222e;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.4;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px;
    }

    /* En-tête & statut Firebase */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 12px;
    }
    .topbar h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }
    .sync-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: var(--orange-bg);
      color: var(--orange-text);
      border: 1px solid rgba(154,103,0,0.2);
    }
    .sync-badge.online {
      background: var(--green-bg);
      color: var(--green-text);
      border-color: rgba(26,127,55,0.2);
    }
    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Résumé financier rapide */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
    }
    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      font-weight: 600;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 700;
      margin-top: 2px;
    }
    .stat-sub {
      font-size: 11px;
      color: var(--muted);
    }

    /* Barre d'actions rapides */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      padding: 10px 12px;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    button {
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      padding: 6px 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: #f3f4f6; }
